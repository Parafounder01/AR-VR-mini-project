<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⚡ WebXR Electronics Lab — CRO & AFO 3D Simulator</title>

  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.3.0/dist/aframe-extras.min.js"></script>
  <script src="https://unpkg.com/aframe-environment-component@1.3.7/dist/aframe-environment-component.min.js"></script>

  <script src="js/signal-engine.js"></script>
  <script src="js/cro-controller.js"></script>
  <script src="js/afo-controller.js"></script>
  <script src="js/main.js"></script>

  <style>
    body { margin: 0; background: #000; }
    #loading-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #0a0a1a; color: #00ff88;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Courier New', monospace; font-size: 1.5em;
      z-index: 9999; flex-direction: column;
    }
  </style>
</head>

<body>
  <div id="loading-overlay">
    <div>⚡ Loading Electronics Lab...</div>
    <div style="font-size:0.6em; color:#888; margin-top:10px;">
      WebXR | Oculus Quest 2/3 | CRO + AFO Interactive
    </div>
  </div>

  <a-scene
    id="main-scene"
    webxr="requiredFeatures: local-floor, bounded-floor; optionalFeatures: hand-tracking, anchors, plane-detection, depth-sensing; referenceSpaceType: local-floor; overlayElement: #xr-overlay"
    renderer="antialias: true; colorManagement: true; physicallyCorrectLights: true; exposure: 1.2; toneMapping: ACESFilmic"
    physics="driver: cannon; gravity: -9.8; debug: false"
    shadow="type: pcfsoft"
    loading-screen="enabled: false"
  >

    <a-assets timeout="10000">
    </a-assets>

    <a-entity environment="preset: default; skyType: gradient; skyColor: #0a0a1a; horizonColor: #1a1a3a; groundColor: #1a1a2e; groundColor2: #0d0d1f; grid: crosses; gridColor: #00ff8830; dressingAmount: 0; fog: 0.95"></a-entity>

    <a-plane id="lab-floor" position="0 0 0" rotation="-90 0 0" width="20" height="20" color="#1a1a2e" roughness="0.9" shadow="receive: true"></a-plane>

    <a-box id="workbench" position="0 0.5 -1.5" width="4" height="1" depth="1.2" color="#2a2a2a" roughness="0.8" metalness="0.3" shadow="cast: true; receive: true"></a-box>

    <a-box position="0 1.02 -1.5" width="4" height="0.02" depth="1.1" color="#003322" material="emission: #00ff8820"></a-box>

    <a-light type="ambient" color="#1a1a2e" intensity="0.5"></a-light>
    <a-light type="directional" color="#ffffff" intensity="0.8" position="3 8 -2" cast-shadow="true"></a-light>
    <a-light type="point" color="#00ff88" intensity="0.6" position="0 2.5 -1.5" distance="6"></a-light>
    <a-light type="point" color="#0088ff" intensity="0.4" position="-1.2 1.5 -1.5" distance="3"></a-light>

    <a-entity id="cro-unit" position="-1.2 1.05 -1.5" rotation="0 15 0" cro-controller>
      <a-box width="0.5" height="0.4" depth="0.35" color="#1a1a1a" metalness="0.7" shadow="cast: true"></a-box>
      <a-plane id="cro-screen" position="0 0.18 0.18" width="0.4" height="0.3" color="#001100" material="emissive: #002200; emissiveIntensity: 0.8"></a-plane>
      <a-text value="CATHODE RAY OSCILLOSCOPE" position="0 0.35 0.18" scale="0.08 0.08 0.08" color="#00ff88" align="center"></a-text>
      <a-text value="CH1" position="-0.15 -0.05 0.18" scale="0.06 0.06 0.06" color="#00ff88"></a-text>
    </a-entity>

    <a-entity id="afo-unit" position="1.1 1.05 -1.5" rotation="0 -10 0" afo-controller>
      <a-box width="0.45" height="0.35" depth="0.3" color="#1a1a1a" metalness="0.7" shadow="cast: true"></a-box>
      <a-plane id="afo-display" position="0 0.1 0.16" width="0.35" height="0.15" color="#001100" material="emissive: #004400"></a-plane>
      <a-text value="AUDIO FREQ OSCILLATOR" position="0 0.3 0.16" scale="0.08 0.08 0.08" color="#ffaa00" align="center"></a-text>
      <a-text value="1kHz" position="-0.1 -0.05 0.16" scale="0.08 0.08 0.08" color="#ffaa00"></a-text>
    </a-entity>

    <a-entity id="multimeter-unit" position="0 1.05 -1.2">
      <a-box width="0.35" height="0.25" depth="0.15" color="#2a2a2a" shadow="cast: true"></a-box>
      <a-text value="MULTIMETER" position="0 0.12 0.08" scale="0.08 0.08 0.08" color="#ffffff" align="center"></a-text>
    </a-entity>

    <a-entity id="signal-info-panel" position="-2.2 1.6 -1.5" rotation="0 30 0">
      <a-plane width="0.8" height="0.6" color="#0a0a1a" opacity="0.92"></a-plane>
      <a-text value="SIGNAL INFO" position="-0.35 0.22 0.01" scale="0.09 0.09 0.09" color="#ffcc00"></a-text>
      <a-text value="Frequency: 1000 Hz" position="-0.35 0.10 0.01" scale="0.07 0.07 0.07" color="#00ff88"></a-text>
      <a-text value="Amplitude: 5.0 V" position="-0.35 0.00 0.01" scale="0.07 0.07 0.07" color="#00ff88"></a-text>
      <a-text value="Waveform: SINE" position="-0.35 -0.10 0.01" scale="0.07 0.07 0.07" color="#ffaa00"></a-text>
    </a-entity>

    <a-entity id="instruction-panel" position="2.2 1.7 -1.5" rotation="0 -30 0">
      <a-plane width="0.85" height="0.65" color="#0a0a1a" opacity="0.9"></a-plane>
      <a-text value="🎮 CONTROLS" position="-0.35 0.25 0.01" scale="0.09 0.09 0.09" color="#ffcc00"></a-text>
      <a-text value="Grip = Grab Component" position="-0.35 0.12 0.01" scale="0.065 0.065 0.065" color="#ffffff"></a-text>
      <a-text value="Trigger = Interact/Click" position="-0.35 0.03 0.01" scale="0.065 0.065 0.065" color="#ffffff"></a-text>
      <a-text value="Thumbstick = Navigate" position="-0.35 -0.06 0.01" scale="0.065 0.065 0.065" color="#ffffff"></a-text>
      <a-text value="A Button = Toggle AR/VR" position="-0.35 -0.15 0.01" scale="0.065 0.065 0.065" color="#ffffff"></a-text>
      <a-text value="B Button = Reset" position="-0.35 -0.24 0.01" scale="0.065 0.065 0.065" color="#ffffff"></a-text>
    </a-entity>

    <a-entity id="ar-toggle-btn" position="0 1.5 -0.8" class="clickable">
      <a-box width="0.18" height="0.08" depth="0.02" color="#003344" material="emissive: #006688"></a-box>
      <a-text value="AR MODE" position="0 0 0.015" scale="0.1 0.1 0.1" color="#00ccff" align="center"></a-text>
    </a-entity>

    <a-entity id="left-hand" oculus-touch-controls="hand: left" laser-controls="hand: left" raycaster="objects: .grabbable, .hoverable, .clickable; far: 5"></a-entity>
    <a-entity id="right-hand" oculus-touch-controls="hand: right" laser-controls="hand: right" raycaster="objects: .grabbable, .hoverable, .clickable; far: 5"></a-entity>

    <a-entity id="camera-rig" position="0 0 1.5" movement-controls="fly: false; speed: 0.15">
      <a-camera id="head" look-controls="pointerLockEnabled: false" fov="75" near="0.05" wasd-controls="enabled: false">
        <a-entity id="wrist-hud" position="-0.25 -0.15 -0.35" rotation="30 0 0" scale="0.5 0.5 0.5">
          <a-plane width="0.4" height="0.2" color="#0a0a1a" opacity="0.8"></a-plane>
          <a-text value="Freq: 1kHz" position="-0.17 0.06 0.01" scale="0.1 0.1 0.1" color="#00ff88"></a-text>
          <a-text value="Wave: SINE" position="-0.17 0.00 0.01" scale="0.1 0.1 0.1" color="#ffaa00"></a-text>
        </a-entity>
      </a-camera>
    </a-entity>

  </a-scene>

  <div id="xr-overlay" style="display:none; position:fixed; top:10px; left:10px;">
    <span style="color:#00ff88; font-family: monospace; font-size:14px;">⚡ Electronics Lab VR</span>
  </div>
</body>
</html>
